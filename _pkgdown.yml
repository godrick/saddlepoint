url: https://godrick.github.io/experiment-spa/

template:
  bootstrap: 5
  includes:
    in_header: pkgdown/in_header.html

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [github]
  components:
    github:
      icon: fa-github
      aria-label: GitHub
      href: https://github.com/godrick/experiment-spa

  # Optional: make the Articles dropdown ordered + numbered
  # (This controls the *navbar* order regardless of filename.)
  articles:
    text: Articles
    menu:
      - text: "1. Simulation: rsim()"
        href: articles/rsim.html
      - text: "2. Inference: find.saddlepoint.MLE()"
        href: articles/mle.html
      - text: "3. Discrepancy diagnostic"
        href: articles/discrepancy.html
      - text: "4. Esscher tilt simulation"
        href: articles/esscher-tilt-simulation.html

home:
  title: "saddlepoint"
  description: "A framework for saddlepoint approximation and inference based on composable CGFs."
  sidebar:
    structure: [links, citation]

authors:
  sidebar:
    roles: [cre]
  footer:
    roles: [cre]
    text: "By"

